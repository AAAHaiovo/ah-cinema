<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="开放短片《花》的 AH 风格占位海报">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1B2620"/>
      <stop offset="0.55" stop-color="#101713"/>
      <stop offset="1" stop-color="#070A08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#C92F36" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#8E2F35" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E05A5F"/>
      <stop offset="0.5" stop-color="#C92F36"/>
      <stop offset="1" stop-color="#7E252B"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D8C72"/>
      <stop offset="1" stop-color="#31473A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>

  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.05">
    <circle cx="300" cy="360" r="238"/>
    <circle cx="300" cy="360" r="300"/>
  </g>

  <path d="M300 410 C300 520 300 590 300 690" stroke="url(#stem)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <ellipse cx="246" cy="566" rx="58" ry="24" fill="#4E6B55" transform="rotate(-27 246 566)"/>
  <ellipse cx="352" cy="616" rx="64" ry="26" fill="#3D5847" transform="rotate(24 352 616)"/>

  <g transform="translate(300 360)">
    <ellipse cx="0" cy="-104" rx="58" ry="112" fill="url(#petal)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-104" rx="58" ry="112" fill="url(#petal)" transform="rotate(45)"/>
    <ellipse cx="0" cy="-104" rx="58" ry="112" fill="url(#petal)" transform="rotate(90)"/>
    <ellipse cx="0" cy="-104" rx="58" ry="112" fill="url(#petal)" transform="rotate(135)"/>
    <ellipse cx="0" cy="-104" rx="46" ry="94" fill="#8E2F35" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="-104" rx="46" ry="94" fill="#8E2F35" transform="rotate(67.5)"/>
    <ellipse cx="0" cy="-104" rx="46" ry="94" fill="#8E2F35" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="-104" rx="46" ry="94" fill="#8E2F35" transform="rotate(157.5)"/>
    <circle cx="0" cy="0" r="46" fill="#E05A5F"/>
    <circle cx="0" cy="0" r="26" fill="#A8242B"/>
    <circle cx="0" cy="-4" r="8" fill="#F2B8BA" opacity="0.8"/>
  </g>

  <text x="300" y="686" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="96" font-weight="700" letter-spacing="10">花</text>
  <text x="300" y="742" text-anchor="middle" fill="#C7C7CC" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="9">FLOWER</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
    <text x="300" y="808" text-anchor="middle" fill="#8E8E93" font-size="15" letter-spacing="4">CC0 · OPEN SHORT</text>
    <text x="300" y="862" text-anchor="middle" fill="#6E6E73" font-size="13" letter-spacing="2">AH 影视 · 开放片库</text>
  </g>
</svg>
