<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AH 影视</title>
  <meta name="description" content="AH 影视 · 粘贴视频链接即可播放的个人播放器，支持 Windows 与 iPhone。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F5F7" id="meta-theme-color">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="meta-status-bar">
  <meta name="apple-mobile-web-app-title" content="AH 影视">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; media-src 'self' https: http: blob:; frame-src https://player.bilibili.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=095">
  <link rel="icon" type="image/png" sizes="48x48" href="./icons/icon-48.png?v=095">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=095">
  <script src="./js/theme-boot.js"></script>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/shell.css">
  <link rel="stylesheet" href="./css/player.css">
  <link rel="stylesheet" href="./css/v2.css">
</head>
<body>
  <div id="app">
    <div class="splash" id="splash" role="status" aria-live="polite">
      <div class="splash-center">
        <span class="splash-mark brand-mark" aria-hidden="true"></span>
        <div class="splash-name">AH 影视</div>
        <p class="splash-tagline">沉静放映室 · 把每一次播放当作一场放映</p>
      </div>
      <div class="splash-status">
        <span class="spinner" aria-hidden="true"></span>
        <span class="splash-sub" id="splash-sub">正在准备播放器…</span>
      </div>
      <button class="splash-skip" id="splash-skip" type="button">点击跳过</button>
    </div>

    <!-- 界面图标。只给外壳用；页面内容仍用 js/ui.js 里的 icon()。 -->
    <svg class="svg-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.8l8.5 6.7v8.2a1.8 1.8 0 0 1-1.8 1.8h-4.1v-5.4H9.4v5.4H5.3a1.8 1.8 0 0 1-1.8-1.8z"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2.5"/><path d="m16 10 4-2.6v9.2L16 14z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.2 4.2"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.8 12a8.2 8.2 0 1 0 2.5-5.9L3.8 8.6"/><path d="M3.8 4.8v3.8h3.8"/><path d="M12 7.6V12l3.2 2"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.3" r="3.7"/><path d="M4.8 20c.7-3.7 3.6-5.8 7.2-5.8s6.5 2.1 7.2 5.8"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.32 5.53A7 7 0 0 1 10.43 5.18L10.54 2.77A9.35 9.35 0 0 1 13.46 2.77L13.57 5.18A7 7 0 0 1 14.68 5.53A7 7 0 0 1 15.71 6.06L17.5 4.44A9.35 9.35 0 0 1 19.56 6.5L17.94 8.29A7 7 0 0 1 18.47 9.32A7 7 0 0 1 18.82 10.43L21.23 10.54A9.35 9.35 0 0 1 21.23 13.46L18.82 13.57A7 7 0 0 1 18.47 14.68A7 7 0 0 1 17.94 15.71L19.56 17.5A9.35 9.35 0 0 1 17.5 19.56L15.71 17.94A7 7 0 0 1 14.68 18.47A7 7 0 0 1 13.57 18.82L13.46 21.23A9.35 9.35 0 0 1 10.54 21.23L10.43 18.82A7 7 0 0 1 9.32 18.47A7 7 0 0 1 8.29 17.94L6.5 19.56A9.35 9.35 0 0 1 4.44 17.5L6.06 15.71A7 7 0 0 1 5.53 14.68A7 7 0 0 1 5.18 13.57L2.77 13.46A9.35 9.35 0 0 1 2.77 10.54L5.18 10.43A7 7 0 0 1 5.53 9.32A7 7 0 0 1 6.06 8.29L4.44 6.5A9.35 9.35 0 0 1 6.5 4.44L8.29 6.06A7 7 0 0 1 9.32 5.53Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5.5 6.5 6.5L9 18.5"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.2 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    </svg>

    <!-- 桌面侧栏 -->
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="sidebar-brand" href="#/" aria-label="AH 影视首页">
        <span class="brand-tile"><span class="brand-mark" aria-hidden="true"></span></span>
        <span class="brand-text"><strong class="brand-name">AH 影视</strong><small class="brand-sub">沉静放映室</small></span>
      </a>
      <nav class="side-group" aria-label="浏览">
        <div class="side-label">浏览</div>
        <a class="tab" href="#/" data-tab="home" aria-label="首页">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-home"/></svg><span>首页</span><i class="tab-dot"></i>
        </a>
        <a class="tab" href="#/local" data-tab="local" aria-label="我的视频">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-video"/></svg><span>我的视频</span><i class="tab-dot"></i>
        </a>
        <a class="tab" href="#/search" data-tab="search" aria-label="搜索">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-search"/></svg><span>搜索</span><i class="tab-dot"></i>
        </a>
        <a class="tab" href="#/history" data-tab="history" aria-label="观看历史">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-history"/></svg><span>观看历史</span><i class="tab-dot"></i>
        </a>
      </nav>
      <nav class="side-group" aria-label="我的">
        <div class="side-label">我的</div>
        <a class="tab" href="#/favorites" data-tab="favorites" aria-label="我的收藏">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-heart"/></svg><span>我的收藏</span><i class="tab-dot"></i>
        </a>
        <a class="tab" href="#/me" data-tab="me" aria-label="我的">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-user"/></svg><span>我的</span><i class="tab-dot"></i>
        </a>
      </nav>
      <div class="side-spacer"></div>
      <a class="tab side-settings" href="#/settings" data-tab="settings" aria-label="设置">
        <svg class="tab-icon" aria-hidden="true"><use href="#i-settings"/></svg><span>设置</span><i class="tab-dot"></i>
      </a>
      <div class="side-foot">
        <div class="side-foot-title">本机放映</div>
        <div class="side-foot-text">片库与观看记录只存在这台设备上，不经过服务器。</div>
      </div>
      <div class="sidebar-note">
        <span class="sidebar-version">v0.9.0 · 界面 v2</span>
      </div>
    </aside>

    <header class="app-header" id="app-header" hidden>
      <div class="app-header-inner">
        <nav class="breadcrumb" aria-label="当前位置">
          <a class="crumb-app" href="#/">AH 影视</a>
          <svg class="crumb-sep" aria-hidden="true"><use href="#i-chevron"/></svg>
          <span class="crumb-current" id="crumb-current">首页</span>
        </nav>
        <span class="topbar-mobile-title">AH 影视</span>
        <div class="header-actions">
          <a class="topbar-search" href="#/search" aria-label="搜索">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <span>搜索影片或链接</span>
          </a>
          <button class="icon-btn" type="button" data-action="toggle-theme" id="theme-toggle" aria-label="切换主题"></button>
          <a class="avatar" href="#/me" aria-label="我的账户">AH</a>
        </div>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <!-- 手机底部标签栏；桌面由左侧栏承担 -->
    <nav class="tabbar" id="tabbar" hidden aria-label="主导航">
      <div class="tabbar-links">
        <a class="tab" href="#/" data-tab="home">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-home"/></svg><span>首页</span><i class="tab-dot"></i>
        </a>
        <a class="tab" href="#/local" data-tab="local">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-video"/></svg><span>视频</span><i class="tab-dot"></i>
        </a>
        <a class="tab" href="#/search" data-tab="search">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-search"/></svg><span>搜索</span><i class="tab-dot"></i>
        </a>
        <a class="tab" href="#/history" data-tab="history">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-history"/></svg><span>历史</span><i class="tab-dot"></i>
        </a>
        <a class="tab" href="#/me" data-tab="me">
          <svg class="tab-icon" aria-hidden="true"><use href="#i-user"/></svg><span>我的</span><i class="tab-dot"></i>
        </a>
      </div>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="dialog-root"></div>

  <noscript>
    <div class="noscript-card">
      <strong>需要开启 JavaScript</strong>
      <p>AH 影视是一个网页 App，请在浏览器设置中允许 JavaScript 后刷新页面。</p>
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
