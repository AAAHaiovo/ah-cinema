<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AH 影视</title>
  <meta name="description" content="AH 影视 · 个人合法影视库：公共领域与开放授权影片，支持 Windows 与 iPhone。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F5F7" id="meta-theme-color">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="meta-status-bar">
  <meta name="apple-mobile-web-app-title" content="AH 影视">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <script src="./js/theme-boot.js"></script>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/player.css">
</head>
<body>
  <div id="app">
    <div class="splash" id="splash" role="status" aria-live="polite">
      <span class="splash-mark brand-mark" aria-hidden="true"></span>
      <div class="splash-name">AH 影视</div>
      <div class="splash-sub" id="splash-sub">正在整理片库…</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <header class="app-header" id="app-header" hidden>
      <div class="app-header-inner">
        <a class="brand" href="#/" aria-label="AH 影视首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">AH 影视</span>
        </a>
        <div class="header-actions">
          <button class="icon-btn" type="button" data-action="toggle-theme" id="theme-toggle" aria-label="切换主题">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
          </button>
          <a class="icon-btn" href="#/settings" aria-label="设置">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2 2-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20h-3v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-2-2 .1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4v-3h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2-2 .1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V4h3v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 2 2-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v3h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
          </a>
        </div>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" hidden aria-label="主导航">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">AH 影视</span>
      </div>
      <div class="tabbar-links">
        <a class="tab" href="#/" data-tab="home">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.8 12 3.6l8.5 7.2V20a1 1 0 0 1-1 1h-5.2v-6.2H9.7V21H4.5a1 1 0 0 1-1-1z"/></svg>
          <span>首页</span>
        </a>
        <a class="tab" href="#/library" data-tab="library">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
          <span>片库</span>
        </a>
        <a class="tab" href="#/search" data-tab="search">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <span>搜索</span>
        </a>
        <a class="tab" href="#/history" data-tab="history">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span>历史</span>
        </a>
        <a class="tab" href="#/me" data-tab="me">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.7-3.5 3.4-5.5 7-5.5s6.3 2 7 5.5"/></svg>
          <span>我的</span>
        </a>
      </div>
      <div class="sidebar-note">
        <span>公共领域 / 开放授权</span>
        <span class="sidebar-version">v0.1.0</span>
      </div>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="dialog-root"></div>

  <noscript>
    <div class="noscript-card">
      <strong>需要开启 JavaScript</strong>
      <p>AH 影视是一个网页 App，请在浏览器设置中允许 JavaScript 后刷新页面。</p>
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
